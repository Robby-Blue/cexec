<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run</title>
    <link rel="stylesheet" href="/layout.css">
    <link rel="stylesheet" href="/run/run.css">
    <script src="/run/run.js" type="module" defer></script>
</head>

<body>
    <div class="center-container floating-container">
        <h1 id="heading">Run</h1>

        <table>
            <tr>
                <td>Script</td>
                <td id="script-cell">...</td>
            </tr>
            <tr>
                <td>Tag</td>
                <td id="tag-cell">...</td>
            </tr>
            <tr>
                <td>Started</td>
                <td id="started-cell">...</td>
            </tr>
            <tr>
                <td>Completed</td>
                <td id="completed-cell">...</td>
            </tr>
            <tr>
                <td>Runtime</td>
                <td id="runtime-cell">...</td>
            </tr>
            <tr>
                <td>Exit Code</td>
                <td id="exit-cell">...</td>
            </tr>
        </table>

        <a id="files-button">Files</a>
    </div>
</body>

</html>
